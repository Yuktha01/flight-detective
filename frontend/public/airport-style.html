<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Airport-style corridor options</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--card:#0d141f;--line:#1f2a3a;--lime:#d4ff3a;--blue:#38bdf8;--txt:#e8edf5;--mut:#7d8aa0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--txt);font:14px system-ui,sans-serif}
input,.tb button,.bd,.gc,.tg,.kt small,.pp{font-family:ui-monospace,Menlo,monospace}
.tb{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tb button{background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:12px}.tb .on{background:var(--lime);color:#000;border-color:var(--lime)}
.demo{display:none;max-width:820px}.demo.on{display:block}.desc{color:var(--mut);font-size:13px;margin:0 0 10px}
.stage{border:1px solid var(--line);border-radius:16px;padding:20px;min-height:400px;background:radial-gradient(ellipse at 80% 0,#13202e,var(--bg) 70%)}
.bar{display:flex;gap:8px}.bar input{flex:1;min-width:0;background:#0a1018;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:13px 14px;font-size:13px}.bar input:focus{outline:1px solid var(--lime)}
.go{background:var(--lime);color:#000;border:0;border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer}
.st{margin:10px 0;font-size:12px;color:var(--blue);min-height:16px}
.xp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}.xp>div{overflow:hidden}
/* 1 board */
.board{background:#05080d;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bh{display:flex;justify-content:space-between;padding:9px 12px;font:10px ui-monospace,monospace;letter-spacing:.14em;color:var(--lime);cursor:pointer}
.board:hover .xp,.board:focus-within .xp{grid-template-rows:1fr}
.bd{display:grid;grid-template-columns:70px 90px 1fr auto;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:12px;cursor:pointer;color:var(--lime)}
.bd:hover{background:#d4ff3a12}.bd .c{color:var(--txt)}.bd i{color:var(--mut);font-style:normal;font-size:10px}
.cols{color:var(--mut)!important;font-size:9px;letter-spacing:.14em;cursor:default}.cols:hover{background:none}
/* 2 gate chips */
.row{display:flex;gap:10px;flex-wrap:wrap}
.gc{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--lime);border-radius:8px;padding:8px 14px;cursor:pointer;text-align:left;color:var(--txt);transition:.15s}
.gc:hover{border-color:var(--lime);background:#12202a}.gc b{display:block;font-size:22px;letter-spacing:.04em}.gc small{color:var(--mut);font-size:10px}.gc em{color:var(--blue);font-style:normal}
/* 3 tags */
.tg{position:relative;background:#e8ebdf;color:#10151c;border:0;padding:10px 14px 10px 36px;clip-path:polygon(0 50%,16px 0,100% 0,100% 100%,16px 100%);cursor:pointer;text-align:left;transition:transform .15s}
.tg::before{content:"";position:absolute;left:12px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--bg)}
.tg:hover{transform:translateY(-3px) rotate(-1.5deg)}.tg b{display:block;font-size:16px}.tg small{font-size:10px;color:#4a5563}.tg span{display:block;font-size:11px;border-top:1px dashed #9aa;margin-top:4px;padding-top:3px}
/* 4 preview */
.pw{position:relative}.pp{position:absolute;top:calc(100% + 8px);left:0;width:300px;background:#0d1522;border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:1fr 92px;opacity:0;transform:translateY(6px);pointer-events:none;transition:.2s;z-index:5;overflow:hidden}
.pw:hover .pp{opacity:1;transform:none}.pp .l{padding:10px 12px}.pp .t{display:flex;align-items:center;justify-content:space-between;font:700 26px ui-monospace,monospace}.pp .t:first-child{color:#7cc4ff}.pp .t span:nth-child(2){font-size:12px;color:var(--blue)}
.pp small{display:block;font-size:9px;color:var(--mut);letter-spacing:.1em;margin-top:8px}.pp p{margin:2px 0 0;font-size:12px}
.pp .s{border-left:1px dashed var(--mut);padding:10px;font-size:11px}.pp .s i{display:block;height:26px;margin-top:8px;background:repeating-linear-gradient(90deg,#fff 0 2px,#0000 2px 4px,#fff 4px 5px,#0000 5px 7px)}
/* 5 kiosk */
.kw:focus-within .xp,.kw:hover .xp{grid-template-rows:1fr}
.kl{font:10px ui-monospace,monospace;color:var(--lime);letter-spacing:.14em;margin:12px 0 8px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding-bottom:4px}
.kt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;color:var(--txt);transition:.15s}
.kt:hover{border-color:var(--lime);transform:translateY(-2px)}.kt b{font-size:20px;display:block}.kt span{color:var(--blue);font-size:12px}.kt small{display:block;color:var(--mut);margin-top:4px;font-size:11px}
</style></head><body>
<div class="tb" id="tb"></div><div id="ds"></div>
<script>
const C=[["Eurasian Corridor","CONTINENTAL","SU1531","TOF","SVO","Tomsk","Moscow","Aeroflot"],["Indo-Pacific Corridor","LONG-HAUL","AI302","DEL","SYD","Delhi","Sydney","Air India"],["Atlantic Corridor","TRANSATLANTIC","BA249","LHR","GIG","London","Rio","British Airways"],["Nordic Corridor","REGIONAL","W24979","CPH","BLL","Copenhagen","Billund","Wizz Air"]];
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const BAR='<div class="bar"><input placeholder="Search flight number (e.g. BA249, AI302, DL402)"><button class="go">Investigate →</button></div><div class="st"></div>';
const M=[
['Departures board','Collapsed to one header line. Hover or focus to open the rows.',()=>`<div class="board"><div class="bh"><span>DEPARTURES · FEATURED CORRIDORS</span><span>4 FLIGHTS ▾</span></div><div class="xp"><div><div class="bd cols"><span>FLIGHT</span><span>ROUTE</span><span>DESTINATION</span><span>TYPE</span></div>${C.map((c,i)=>`<div class="bd" data-i="${i}"><span>${c[2]}</span><span class="c">${c[3]} → ${c[4]}</span><span class="c">${c[6].toUpperCase()}</span><i>${c[1]}</i></div>`).join('')}</div></div></div>`],
['Gate codes','Always visible, one line. Destination code leads like a gate sign.',()=>`<div class="row">${C.map((c,i)=>`<button class="gc" data-i="${i}"><b>${c[4]}</b><small>${c[2]} · <em>${c[3]}</em> → ${c[6]}</small></button>`).join('')}</div>`],
['Baggage tags','Always visible, one line. Tag shape with a punched hole.',()=>`<div class="row">${C.map((c,i)=>`<button class="tg" data-i="${i}"><b>${c[3]} → ${c[4]}</b><small>${c[1]}</small><span>${c[2]}</span></button>`).join('')}</div>`],
['Pass preview','Tiny chips. Hover one to see a mini boarding pass, click to run it.',()=>`<div class="row">${C.map((c,i)=>`<div class="pw"><button class="gc" data-i="${i}"><b style="font-size:15px">${c[2]}</b><small>${c[3]} → ${c[4]}</small></button><div class="pp"><div class="l"><div class="t"><span>${c[3]}</span><span>✈</span><span style="color:#fff;font-size:26px">${c[4]}</span></div><small>CARRIER</small><p>${c[7]}</p><small>FLIGHT</small><p style="color:#7cc4ff">${c[2]}</p></div><div class="s">${c[3]} ✈ ${c[4]}<i></i></div></div></div>`).join('')}</div>`],
['Kiosk panel','Hidden until you focus the input, then four large touch tiles open.',()=>`<div class="kw"><div class="bar"><input placeholder="Search flight number (e.g. BA249, AI302, DL402)"><button class="go">Investigate →</button></div><div class="xp"><div><div class="kl">QUICK SELECT · FEATURED CORRIDORS</div><div class="kg">${C.map((c,i)=>`<button class="kt" data-i="${i}"><b>${c[2]}</b><span>${c[3]} → ${c[4]}</span><small>${c[5]} to ${c[6]}</small></button>`).join('')}</div></div></div></div>`]];
const tb=$('#tb'),ds=$('#ds');
M.forEach(([n,d,h],k)=>{const b=document.createElement('button');b.textContent=(k+1)+' '+n;b.onclick=()=>show(k);tb.append(b);
const s=document.createElement('section');s.className='demo';s.innerHTML=`<p class="desc">${k+1} · ${d}</p><div class="stage">${k==4?'':BAR}${h()}</div>`;if(k==4){$('.kw',s).insertAdjacentHTML('afterend','<div class="st"></div>')}ds.append(s);
const inp=$('input',s),st=$('.st',s);
s.onclick=e=>{const t=e.target.closest('[data-i]');if(t){const c=C[t.dataset.i];inp.value=c[2];st.textContent='Investigating '+c[2]+' · '+c[3]+' → '+c[4]+'…'}};
$('.go',s).onclick=()=>{const v=inp.value.trim();st.textContent=v?'Investigating '+v+'…':'Enter a flight number first'}});
const show=k=>{$$('button',tb).forEach((b,j)=>b.classList.toggle('on',j==k));$$('.demo').forEach((d,j)=>d.classList.toggle('on',j==k))};show(0);
</script></body></html>
